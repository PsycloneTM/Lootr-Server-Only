name: release

on:
workflow_dispatch:
inputs:
version:
description: 'Version number, no leading v (e.g. 1.0.1)'
required: true
prerelease:
description: 'Mark as pre-release'
type: boolean
default: false

jobs:
release:
runs-on: ubuntu-22.04

```
permissions:
  contents: write

steps:
  - name: checkout repository
    uses: actions/checkout@v6

  - name: validate gradle wrapper
    uses: gradle/actions/wrapper-validation@v6

  - name: setup jdk 21
    uses: actions/setup-java@v5
    with:
      java-version: 21
      distribution: 'microsoft'

  - name: make gradle wrapper executable
    run: chmod +x ./gradlew

  - name: build
    env:
      VERSION: ${{ inputs.version }}
    run: ./gradlew build -Pmod_version="$VERSION"

  - name: collect release artifacts
    id: artifacts
    shell: bash
    run: |
      mapfile -t ASSETS < <(
        find fabric/build/libs neoforge/build/libs \
          -maxdepth 1 \
          -type f \
          -name '*.jar' \
          ! -name '*-sources.jar' \
          ! -name '*-dev.jar' \
          -print
      )

      if [ "${#ASSETS[@]}" -eq 0 ]; then
        echo "ERROR: No release JARs were found."
        echo "Fabric build directory:"
        ls -la fabric/build/libs || true
        echo "NeoForge build directory:"
        ls -la neoforge/build/libs || true
        exit 1
      fi

      echo "Release artifacts:"
      printf '%s\n' "${ASSETS[@]}"

      {
        echo 'assets<<EOF'
        printf '%s\n' "${ASSETS[@]}"
        echo 'EOF'
      } >> "$GITHUB_OUTPUT"

  - name: create release
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
    shell: bash
    run: |
      FLAGS=()

      if [ "$PRERELEASE" = "true" ]; then
        FLAGS+=(--prerelease)
      fi

      mapfile -t ASSETS <<< '${{ steps.artifacts.outputs.assets }}'

      gh release create "v$VERSION" \
        "${ASSETS[@]}" \
        --target "$GITHUB_SHA" \
        --title "v$VERSION" \
        --generate-notes \
        "${FLAGS[@]}"
```
