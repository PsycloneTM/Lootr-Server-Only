## Fabric-only properties (root NeoForge properties above are unaffected)
## Matched to the same target: Minecraft 1.21.1.
## yarn_mappings is currently UNUSED - fabric/build.gradle now builds
## against loom.officialMojangMappings() instead of this Yarn dependency,
## because the already-written Fabric ports (LootrLootState,
## PlayerScopedContainer, ModLootTags, ModAttachments) all use Mojang-
## mapped class names to stay identical to the NeoForge source, and would
## not compile under Yarn's different names. Left here rather than deleted
## in case a Yarn-mapped run config or IDE mapping still references it.
yarn_mappings=1.21.1+build.3
fabric_loader_version=0.16.5
fabric_loader_version_range=>=0.16.5
## fabric_minecraft_version_range: fabric.mod.json was wrongly reusing
## minecraft_version_range (`[1.21.1]`) above, which is NeoForge's Maven-
## style interval syntax (used in neoforge.mods.toml). Fabric Loader parses
## its "minecraft" depends entry with its OWN syntax instead - a SemVer
## superset supporting `~`, `^`, `>=`, `*`, or a bare exact version - and
## rejects bracket/interval notation outright. That mismatch is what
## produced the confusing "requires version [1.21.1] ... but only the
## wrong version is present: 1.21.1!" error and the mangled
## "[(-∞,∞)]" in Fabric Loader's suggested fix - Loader was failing to
## parse "[1.21.1]" as its own range grammar, not reporting a genuine
## version conflict. `~1.21.1` matches any 1.21.1.x patch release without
## matching 1.21.2, mirroring the exact-pin intent of `[1.21.1]` in
## Fabric's own syntax. Confirmed against FabricMC's own fabric.mod.json
## docs, which show exactly this `~` form for a pinned minor version.
fabric_minecraft_version_range=~1.21.1
## Fabric API umbrella version pinned to MC 1.21.1 (confirmed real/current on
## CurseForge as of this port - "[1.21.1] Fabric API 0.116.9+1.21.1"). Only
## the fabric-data-attachment-api-v1 MODULE is actually depended on (see
## fabric/build.gradle) via fabricApi.module(name, this version) - Loom
## resolves the correct per-module artifact/version from this umbrella
## version, so this one property is all that needs bumping later.
fabric_api_version=0.116.9+1.21.1

## MixinExtras: used by the item-frame auto-marking mixins on both loaders
## (@WrapOperation). NeoForge bundles this automatically since 20.3 and needs
## no dependency; Fabric Loader also bundles it since 0.15.0+, but this pins
## the exact version compiled/tested against rather than relying on whatever
## the loader happens to include (the officially documented, safer approach).
mixin_extras_version=0.5.4
