pluginManagement {
    repositories {
        maven { url = "https://maven.neoforged.net/releases" }
        maven { name = "Fabric"; url = "https://maven.fabricmc.net/" }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = "lootr-serveronly"

include("common")
include("fabric")
include("neoforge")
