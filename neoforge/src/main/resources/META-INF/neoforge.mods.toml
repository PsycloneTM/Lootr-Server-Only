modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/yourname/lootr-serveronly/issues"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    authors = "${mod_authors}"
    description = '''
${mod_description}
'''

    # This is the field that actually tells the mod loader / launchers
    # (and multiplayer server browsers, e.g. via the ping response) that
    # a vanilla client does not need this mod to connect. Combined with
    # never registering client-only content, this is what makes the mod
    # "invisible" to unmodified clients joining the server.
    #
    # IGNORE_SERVER_VERSION (not IGNORE_ALL_VERSION) is the documented
    # value for this specific case: a mod that DOES matter on the server
    # but should not be required on the client. IGNORE_ALL_VERSION is for
    # mods with no server-side component at all, which is the opposite of
    # this mod.
    displayTest = "IGNORE_SERVER_VERSION"

# Mixins tag vanilla item frames that structures spawn and make suspicious
# sand/gravel per-player. They register nothing and change no client-visible
# content, so a vanilla client is unaffected.
[[mixins]]
    config = "lootr_serveronly.mixins.json"

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${neoforge_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"
