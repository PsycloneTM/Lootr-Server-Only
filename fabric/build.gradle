plugins {
    id 'fabric-loom'
}

// --- THE KEY "SERVER-ONLY" DECISION (Fabric side) ---
// The loader-level question that decides whether the whole "vanilla client,
// zero client mod" design is viable on Fabric at all, now resolved:
//
//   Plain Fabric Loader has no client/server registry-sync handshake of
//   its own. The thing that actually kicks vanilla clients for missing
//   content is Fabric API's `fabric-registry-sync-v0` module, which syncs
//   Block/Item/Fluid/BlockEntityType registries and disconnects clients
//   whose registries don't match (see FabricMC/fabric#2168 — there is
//   currently no supported way to exempt a registry entry from that sync).
//
// Practical upshot, unchanged from the NeoForge side: this mod must not
// register any new Block/Item/BlockEntityType, and must not depend on
// Fabric API's registry-sync module.
//
// What this DOES need, now that loot-container porting has started: a
// Fabric-side equivalent of NeoForge's Data Attachment API. Fabric API ships
// exactly this as its OWN separate module, `fabric-data-attachment-api-v1`
// (net.fabricmc.fabric-api:fabric-data-attachment-api-v1 on Maven) — a
// distinct artifact from fabric-registry-sync-v0, confirmed via FabricMC's
// own module list and the fabric-api-bom's per-module dependency listing.
// Depending on it via `fabricApi.module(...)` (Loom's own documented helper
// for pulling in exactly one Fabric API module rather than the whole
// umbrella jar) pulls in ONLY that module's classes, not registry-sync.
// AttachmentRegistry.create(...) is the direct analogue of NeoForge's
// AttachmentType.builder(...) - see ModAttachments.java for the port.
loom {
    // No splitEnvironmentSourceSets() — there is intentionally no client
    // source set here, mirroring the NeoForge side having no client run.

    // No `mixin { ... }` block on purpose. In current Loom (1.14.3 here) the mixin annotation processor is off by
    // default and no refmap is generated: Loom remaps the mixins' targets inside the jar instead (Fabric wiki,
    // "Mixins and Obfuscation"). The old defaultRefmapName setting is therefore dead config, and Loom prints "the
    // mixin annotation is no longer enabled by default, you should remove any loom.mixin configuration" while it exists.
    // If a production server ever fails to apply a mixin that works in runServer, set
    // `mixin { useLegacyMixinAp = true }` here and put the "refmap" entry back in lootr_serveronly.mixins.json.
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    // Official Mojang mappings, NOT Yarn (see fixed mismatch below), so
    // that source is genuinely shared with the NeoForge module. Every
    // Fabric-side loader-agnostic port so far (LootrLootState,
    // PlayerScopedContainer, ModLootTags - all copied verbatim from
    // neoforge/) uses Mojang-mapped names throughout (net.minecraft.core.*,
    // net.minecraft.world.Container, ContainerHelper, ResourceLocation,
    // etc.). Yarn remaps all of those to different class/method names
    // (e.g. PlayerEntity instead of Player, World instead of Level,
    // ActionResult instead of InteractionResult), so building against Yarn
    // as this file previously did would fail to compile against those
    // already-written files. gradle.properties' yarn_mappings property is
    // now unused and can be removed once this is confirmed building.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"

    // Single-module Fabric API dependency: only fabric-data-attachment-api-v1,
    // NOT the full net.fabricmc.fabric-api:fabric-api umbrella jar, and
    // deliberately NOT fabric-registry-sync-v0. `include(...)` bundles the
    // module's classes into our jar so the mod works standalone without
    // requiring the user to separately install Fabric API on the server.
    modImplementation include(fabricApi.module("fabric-data-attachment-api-v1", fabric_api_version))

    // fabric-events-interaction-v0: UseBlockCallback, the Fabric API
    // equivalent of NeoForge's PlayerInteractEvent.RightClickBlock - see
    // ContainerInteractionHandler's javadoc for the exact interface this
    // pulls in. Also just a hook-registration module, not registry-sync;
    // same include(...) treatment so a bare server doesn't need Fabric API
    // installed separately.
    modImplementation include(fabricApi.module("fabric-events-interaction-v0", fabric_api_version))

    // fabric-command-api-v2: CommandRegistrationCallback, used only to
    // register the /lootr admin command (see LootrCommands).
    // UNVERIFIED: I could not read this module's dependency list for this
    // Fabric API version, so I have NOT confirmed it avoids
    // fabric-registry-sync-v0 (the module that would kick vanilla clients).
    // CHECK on first boot: the "Loading N mods" list in the server log must
    // NOT contain fabric-registry-sync-v0. If it does, remove this line and
    // LootrCommands.register() from LootrServerOnlyFabric.
    modImplementation include(fabricApi.module("fabric-command-api-v2", fabric_api_version))

    // MixinExtras for @WrapOperation, used by the item-frame auto-marking
    // mixins (MixinStructureTemplate, MixinEndCityPiece - see
    // ItemFrameMarker's javadoc). Fabric Loader 0.15.0+ already bundles
    // MixinExtras, and this project's fabric_loader_version (0.16.5) is
    // comfortably above that, so this dependency is redundant at runtime -
    // it is added anyway because pinning the exact version compiled and
    // tested against is the officially documented, safer path (Fabric wiki,
    // MixinExtras' own install guide) rather than relying implicitly on
    // whatever a given Loader release happens to include.
    annotationProcessor "io.github.llamalad7:mixinextras-common:${mixin_extras_version}"
    implementation "io.github.llamalad7:mixinextras-fabric:${mixin_extras_version}"
}

// Shared loader-independent code (see common/). Compiled against and available in dev runs, and bundled into
// this mod's jar rather than published as a separate mod.
dependencies {
    compileOnly project(':common')
    runtimeOnly project(':common')
}

tasks.named('jar') {
    from project(':common').sourceSets.main.output
}
